                        <option value="Planta, Mina el Romeral">Planta, Mina el Romeral</option>

        const CACHE_CATASTRO_KEY = 'cio_cached_catastro';
        let mapaPWA = null;
        
        const DB_NAME = 'CIO_BovedaOffline';
        const STORE_NAME = 'reportes_pendientes';
        let dbLocal = null;

       // DICCIONARIO INTELIGENTE EXTENDIDO (ENFOQUE CBM Y MINERÍA)
        const HALLAZGOS_POR_TIPO = {

                { frase: '⚙️ Desgaste severo en revestimiento o gargantas del tambor', label: '⚙️ Revestimiento dañado' },

            ],
            chumacera: [ // Rodamientos, Chumaceras, Descansos
                { frase: '🔥 Alta temperatura detectada (Condición crítica)', label: '🔥 Alta Temperatura' },

            ],

                { frase: '🫧 Ruido de cavitación en voluta', label: '🫧 Cavitación' },
                { frase: '📉 Pérdida evidente de presión o flujo', label: '📉 Pérdida de presión' },
                { frase: '⚠️ Vibración alta en conjunto impulsor', label: '⚠️ Vibración impulsor' },
                { frase: '🔥 Sobrecalentamiento en descansos de la bomba', label: '🔥 Descansos calientes' }
            ],
            hidraulico: [ // Sistemas de lubricación, HPU
                { frase: '🛢️ Fuga de fluido en mangueras, acoples o block', label: '🛢️ Fuga manguera/acople' },
                { frase: '📉 Presión de sistema por debajo de parámetros', label: '📉 Baja presión' },
                { frase: '🛑 Filtro saturado (Indicador en rojo)', label: '🛑 Filtro saturado' },
                { frase: '📊 Nivel de estanque bajo nivel mínimo', label: '📊 Estanque bajo' },
                { frase: '🌡️ Falla en intercambiador de calor / Aceite caliente', label: '🌡️ Aceite caliente' }
            ],
            estructura: [
                { frase: '🔩 Pernos basales sueltos o cortados', label: '🔩 Pernos sueltos' },
                { frase: '⚡ Fisura de fatiga o grieta en placa soldada', label: '⚡ Fisura estructural' },
                { frase: '🛑 Polín trabado generando fricción en banda', label: '🛑 Polín trabado' },
                { frase: '🛡️ Rozamiento de elementos rotatorios contra protecciones', label: '🛡️ Guarda rozando' },

            ],
            general: [

                { frase: '📢 Ruido mecánico anómalo general', label: '📢 Ruido anómalo' },
                { frase: '⚠️ Vibración mecánica severa', label: '⚠️ Alta Vibración' },
                { frase: '🔥 Temperatura elevada fuera de rango', label: '🔥 Alta Temperatura' },
                { frase: '🔩 Soltura de componentes o anclajes', label: '🔩 Soltura general' },
                { frase: '🛑 Equipo detenido o en falla funcional', label: '🛑 Falla Funcional' }
            ]
        };

        window.actualizarHallazgosPorSpot = function(spotName) {
            const lower = spotName.toLowerCase();
            let tipo = 'general';
            
            // Motor de búsqueda inteligente de categorías
            if (lower.includes('motor') || lower.includes('ventilador')) tipo = 'motor';
            else if (lower.includes('reductor') || lower.includes('transmisi') || lower.includes('caja')) tipo = 'reductor';
            else if (lower.includes('polea') || lower.includes('correa') || lower.includes('tambor')) tipo = 'polea';
            else if (lower.includes('estructura') || lower.includes('chasis') || lower.includes('bastidor')) tipo = 'estructura';
            else if (lower.includes('bomba') || lower.includes('pump')) tipo = 'bomba';
            else if (lower.includes('rodamiento') || lower.includes('chumacera') || lower.includes('descanso')) tipo = 'chumacera';
            else if (lower.includes('hidr') || lower.includes('lubricaci') || lower.includes('aceite') || lower.includes('hpu')) tipo = 'hidraulico';

            const fallas = HALLAZGOS_POR_TIPO[tipo] || HALLAZGOS_POR_TIPO.general;
            const contenedor = document.getElementById('contenedor-chips-dinamicos');
            
            if (contenedor) {
                contenedor.innerHTML = '';
                chipsSeleccionados = [];
                document.getElementById('fieldDetalle').value = ''; 
                
                fallas.forEach(falla => { 
                    contenedor.innerHTML += `<div class="chip" onclick="window.toggleChip(this, '${falla.frase}')">${falla.label}</div>`; 
                });
            }
        }

        // BÓVEDA OFFLINE
        function inicializarBoveda() {
            try {
                if (!window.indexedDB) return;
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const base = e.target.result;
                    if (!base.objectStoreNames.contains(STORE_NAME)) base.createObjectStore(STORE_NAME, { keyPath: 'id_local' });
                };
                request.onsuccess = (e) => {
                    dbLocal = e.target.result;
                    actualizarContadorOffline();
                    sincronizarBovedaOffline();
                };
            } catch (error) {}
        }
        inicializarBoveda();

        function guardarEnBoveda(payload) {
            if (!dbLocal) return;
            payload.id_local = Date.now().toString();
            try {
                const tx = dbLocal.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).add(payload);
                tx.oncomplete = () => { window.mostrarNotificacion("📴 Guardado offline."); actualizarContadorOffline(); };
            } catch(e) {}
        }

        window.sincronizarBovedaOffline = function() {
            if (!navigator.onLine || !dbLocal || !dbAlertas) return;
            try {
                const tx = dbLocal.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const request = store.getAll();
                request.onsuccess = () => {
                    const reportes = request.result;
                    if (reportes.length === 0) return;
                    window.mostrarNotificacion(`🟢 Sincronizando ${reportes.length} pendientes...`);
                    reportes.forEach(reporte => {
                        const idTemp = reporte.id_local;
                        delete reporte.id_local;
                        dbAlertas.push(reporte).then(() => {
                            const deleteTx = dbLocal.transaction(STORE_NAME, 'readwrite');
                            deleteTx.objectStore(STORE_NAME).delete(idTemp);
                            deleteTx.oncomplete = () => actualizarContadorOffline();
                        });
                    });
                };
            } catch(e) {}
        }

        function actualizarContadorOffline() {
            if (!dbLocal) return;
            try {
                const tx = dbLocal.transaction(STORE_NAME, 'readonly');
                const request = tx.objectStore(STORE_NAME).count();
                request.onsuccess = () => {
                    const count = request.result;
                    const cDiv = document.getElementById('contadorOffline');
                    if (cDiv) cDiv.innerText = count;
                    if(count > 0 && navigator.onLine) window.sincronizarBovedaOffline();
                };
            } catch(e) {}
        }

        window.addEventListener('online', () => {
            const badge = document.getElementById('badgeConexion');
            if (badge) { badge.innerText = '🟢 ONLINE'; badge.className = 'badge-status online'; }
            window.sincronizarBovedaOffline();
        });
        window.addEventListener('offline', () => {
            const badge = document.getElementById('badgeConexion');
            if (badge) { badge.innerText = '🔴 OFFLINE'; badge.className = 'badge-status offline'; }
        });

        // NAVEGACIÓN Y WIZARD
        window.cambiarVistaPWA = function(vista) {
            document.getElementById('vista-reporte').style.display = vista === 'reporte' ? 'block' : 'none';
            document.getElementById('vista-mapa').style.display = vista === 'mapa' ? 'flex' : 'none';
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            const btnNav = document.getElementById('nav-btn-' + vista);
            if (btnNav) btnNav.classList.add('active');

            if (vista === 'mapa') {
                if (!mapaPWA) { setTimeout(() => { window.inicializarMapaPWA(); }, 200); } 
                else { setTimeout(() => { mapaPWA.invalidateSize(); }, 200); }
            }
        }

        window.avanzarPaso = function(numPaso) {
            document.querySelectorAll('.wizard-step').forEach(step => step.classList.remove('active'));
            const siguientePaso = document.getElementById(`step-${numPaso}`);
            if (siguientePaso) { siguientePaso.classList.add('active'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        }

        window.mostrarNotificacion = function(msg) {
            const t = document.getElementById('toastNotificacion');
            if (t) { t.innerText = msg; t.style.display = 'block'; setTimeout(() => { t.style.display = 'none'; }, 4000); }
        }

        // CARGA DE EQUIPOS Y SPOTS DESDE FIREBASE
        function cargarDeCacheLocalInmediato() {
            const cached = localStorage.getItem(CACHE_CATASTRO_KEY);
            if (cached) { try { catalogoGlobal = JSON.parse(cached); window.cargarAreasPorFaena(); } catch(e) {} }

        cargarDeCacheLocalInmediato();

        if (activosRef) {
            activosRef.on('value', snap => {
                const raw = snap.val();
                if (raw) {
                    catalogoGlobal = Object.keys(raw).map(k => {
                        const data = raw[k] || {};
                        const rawLat = data.latitud ?? data.Latitud ?? data.lat ?? data.Lat ?? data.latitude ?? null;
                        const rawLng = data.longitud ?? data.Longitud ?? data.lng ?? data.Lng ?? data.lon ?? data.longitude ?? null;

                        return {
                            id: k,
                            tag: String(data.tag || data.Tag || data.TAG || data.equipo || data.Equipo || data.nombre || k || 'SIN-TAG').trim(),
                            area: String(data.area || data.Area || 'Área General').trim(),
                            siteId: String(data.siteId || data.site || data.faena || data.Faena || 'Planta, Mina los Colorados').trim(),
                            lat: rawLat ? parseFloat(rawLat) : null,
                            lng: rawLng ? parseFloat(rawLng) : null,
                            sev: data.severidad || data.estado || 'Verde',
                            // NUEVO: Heredamos los componentes / spots del equipo
                            components: data.components || data.spots || []
                        };
                    });
                    localStorage.setItem(CACHE_CATASTRO_KEY, JSON.stringify(catalogoGlobal));
                    window.cargarAreasPorFaena(); 
                }
            });
        }

        window.cargarAreasPorFaena = function() {
            const faenaSelect = document.getElementById('fieldFaena');
            if (!faenaSelect) return;
            const faenaVal = faenaSelect.value;
            const filtered = catalogoGlobal.filter(e => e.siteId === faenaVal);
            const areasUnicas = [...new Set(filtered.map(e => e.area))].filter(Boolean).sort();
            
            const selectArea = document.getElementById('fieldArea');
            if (selectArea) {
                selectArea.innerHTML = '<option value="">-- Selecciona el Área --</option>' + areasUnicas.map(a => `<option value="${a}">${a}</option>`).join('');
            }
            const selectEquipo = document.getElementById('fieldTagSelect');
            if (selectEquipo) selectEquipo.innerHTML = '<option value="">-- Selecciona el equipo --</option>';
            window.poblarSpotsEquipo(null);
        }

        window.cargarEquiposPorArea = function() {
            const faenaVal = document.getElementById('fieldFaena').value;
            const areaVal = document.getElementById('fieldArea').value;
            const filtered = catalogoGlobal.filter(e => e.siteId === faenaVal && e.area === areaVal);
            
            const selectEquipo = document.getElementById('fieldTagSelect');
            if (selectEquipo) {
                selectEquipo.innerHTML = '<option value="">-- Selecciona el equipo --</option>' + filtered.sort((a,b) => a.tag.localeCompare(b.tag)).map(e => `<option value="${e.tag}">${e.tag}</option>`).join('');
            }
            window.poblarSpotsEquipo(null);
        }

        // LÓGICA DINÁMICA DE SPOTS Y CHIPS
        window.seleccionarEquipoTag = function(tagVal) {
            equipoSeleccionadoActual = catalogoGlobal.find(e => e.tag === tagVal);
            window.poblarSpotsEquipo(equipoSeleccionadoActual ? equipoSeleccionadoActual.components : []);
        }

        window.poblarSpotsEquipo = function(componentsList) {
            const selSpot = document.getElementById('fieldSpot');
            selSpot.innerHTML = '<option value="Condición Global del Equipo">🌐 Condición Global (Todo el equipo)</option>';

            if (componentsList && componentsList.length > 0) {
                componentsList.forEach(comp => {
                    const nombreComp = typeof comp === 'string' ? comp : (comp.name || comp.nombre || 'Componente');
                    selSpot.innerHTML += `<option value="${nombreComp}">⚙️ ${nombreComp}</option>`;
                });
            }
            window.actualizarHallazgosPorSpot(selSpot.value);
        }

        window.actualizarHallazgosPorSpot = function(spotName) {
            const lower = spotName.toLowerCase();
            let tipo = 'general';
            if (lower.includes('motor')) tipo = 'motor';
            else if (lower.includes('reductor') || lower.includes('transmisi')) tipo = 'reductor';
            else if (lower.includes('polea') || lower.includes('correa')) tipo = 'polea';
            else if (lower.includes('estructura') || lower.includes('chasis')) tipo = 'estructura';

            const fallas = HALLAZGOS_POR_TIPO[tipo] || HALLAZGOS_POR_TIPO.general;
            const contenedor = document.getElementById('contenedor-chips-dinamicos');
            if (contenedor) {
                contenedor.innerHTML = '';
                chipsSeleccionados = [];
                // Reseteamos el text area si cambian el componente
                document.getElementById('fieldDetalle').value = ''; 
                fallas.forEach(falla => { 
                    contenedor.innerHTML += `<div class="chip" onclick="window.toggleChip(this, '${falla.frase}')">${falla.label}</div>`; 
                });
            }
        }

        window.toggleChip = function(chipEl, fraseCompleta) {
            if (chipEl.classList.contains('active')) {
                chipEl.classList.remove('active');
                chipsSeleccionados = chipsSeleccionados.filter(c => c !== fraseCompleta);
            } else {
                chipEl.classList.add('active');
                chipsSeleccionados.push(fraseCompleta);
            }
        }

        // DICTADO POR VOZ Y MULTIMEDIA
        window.iniciarDictado = function() {
            try {
                const btn = document.getElementById('btn-dictado');
                const cajaTexto = document.getElementById('fieldDetalle');
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) { alert("Navegador sin soporte de voz."); return; }
                const rec = new SpeechRecognition();
                rec.lang = 'es-CL';
                rec.onstart = () => { btn.style.background = '#ef4444'; window.mostrarNotificacion("🎙️ Escuchando..."); };
                rec.onresult = (e) => { cajaTexto.value = (cajaTexto.value + " " + e.results[0][0].transcript).trim(); };
                rec.onend = () => { btn.style.background = 'transparent'; }; // Mantenemos el estilo de tu UI
                rec.start();
            } catch (e) { alert("Error con el micrófono."); }
        }

        window.procesarYComprimirMedia = async function(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            for (let i = 0; i < files.length; i++) {
                if (files[i].type.startsWith('image/')) { await procesarImagen(files[i]); } 
                else if (files[i].type.startsWith('video/')) { await procesarVideo(files[i]); }
            }
            renderizarGaleria();
        }

        function procesarImagen(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        try {
                            const canvas = document.getElementById('resizeCanvas');
                            if(!canvas) return resolve();
                            const ctx = canvas.getContext('2d');
                            let width = img.width, height = img.height;
                            if (width > 640) { height = Math.round((height * 640) / width); width = 640; }
                            canvas.width = width; canvas.height = height;
                            ctx.drawImage(img, 0, 0, width, height);
                            arregloEvidencias.push({ tipo: 'imagen', data: canvas.toDataURL('image/jpeg', 0.5) });
                        } catch(err) {} resolve();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function procesarVideo(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) { arregloEvidencias.push({ tipo: 'video', data: e.target.result }); resolve(); };
                reader.readAsDataURL(file);
            });
        }

        window.eliminarEvidenciaPWA = function(index) {
            arregloEvidencias.splice(index, 1); renderizarGaleria();
        }

        function renderizarGaleria() {
            const gallery = document.getElementById('mediaGallery');
            if (!gallery) return;
            gallery.innerHTML = '';
            arregloEvidencias.forEach((ev, index) => {
                let cont = ev.tipo === 'imagen' ? `<img src="${ev.data}" style="border-radius:8px; height:80px; width:80px; object-fit:cover;">` : `<div style="background:#ef4444; color:white; height:80px; width:80px; border-radius:8px; display:flex; align-items:center; justify-content:center;">🎥</div>`;
                gallery.innerHTML += `<div style="position:relative; display:inline-block; margin:5px;">${cont}<button type="button" onclick="window.eliminarEvidenciaPWA(${index})" style="position:absolute; top:-5px; right:-5px; background:#ef4444; color:white; border:none; border-radius:50%; width:24px; height:24px; cursor:pointer;">X</button></div>`;
            });
        }

        // ENVIAR ALERTA CON SPOTS
        window.selectSevFat = function(sev) {
            document.getElementById('fieldSev').value = sev;
            ['Verde', 'Amarillo', 'Naranja', 'Rojo'].forEach(s => {
                const btn = document.getElementById('sev_' + s);
                if (btn) btn.className = 'sev-fat-btn' + (s === sev ? ` sel-${sev.toLowerCase()}` : '');
            });
        }

        window.enviarAlertaSegura = function() {
            const tagSelect = document.getElementById('fieldTagSelect').value;
            if (!tagSelect) { alert("⚠️ Selecciona un equipo en el Paso 1."); window.avanzarPaso(1); return; }

            const spotFinal = document.getElementById('fieldSpot').value;
            const sev = document.getElementById('fieldSev').value;
            const notasManuales = document.getElementById('fieldDetalle').value.trim();
            const btnTransmitir = document.getElementById('btn-transmitir-final');

            let textoFinal = `[COMPONENTE: ${spotFinal}]\n`;
            if (chipsSeleccionados.length > 0) textoFinal += "📌 Hallazgos: " + chipsSeleccionados.join(" | ") + "\n";
            if (notasManuales !== "") textoFinal += "📝 Notas: " + notasManuales;

            // Validación de contenido
            if (chipsSeleccionados.length === 0 && notasManuales === "" && arregloEvidencias.length === 0) {
                alert("⚠️ Ingresa notas, selecciona hallazgos o adjunta evidencia multimedia.");
                window.avanzarPaso(2);
                return; 
            }

            const primerFoto = arregloEvidencias.find(e => e.tipo === 'imagen');

            const payload = {
                faena: document.getElementById('fieldFaena').value,
                area: document.getElementById('fieldArea').value,
                tag: tagSelect,
                componente: spotFinal, // Enviamos el Spot Exacto
                severidad: sev,
                detalle: textoFinal,
                fotoBase64: primerFoto ? primerFoto.data : '',
                evidencias: arregloEvidencias,
                timestamp: new Date().toISOString(),
                estado: 'nuevo'
            };

            btnTransmitir.disabled = true;
            btnTransmitir.innerHTML = `<span class="material-symbols-outlined">sync</span> ENVIANDO...`;

            if (navigator.onLine && dbAlertas) {
                dbAlertas.push(payload).then(() => { 
                    window.mostrarNotificacion("✅ Reporte enviado al CIO."); 
                    limpiarTrasEnvio(btnTransmitir); 
                }).catch(() => { 
                    guardarEnBoveda(payload); 
                    limpiarTrasEnvio(btnTransmitir); 
                });
            } else { 
                guardarEnBoveda(payload); 
                limpiarTrasEnvio(btnTransmitir); 
            }
        }

        function limpiarTrasEnvio(btn) {
            document.getElementById('fieldDetalle').value = '';
            chipsSeleccionados = []; arregloEvidencias = []; renderizarGaleria();
            document.getElementById('fieldTagSelect').value = '';
            window.poblarSpotsEquipo(null);
            
            btn.disabled = false;
            btn.innerHTML = `<span class="material-symbols-outlined">send</span> TRANSMITIR AL CIO`;
            window.avanzarPaso(1); 
        }

        // MAPA Y PUENTE
        window.inicializarMapaPWA = function() {
            try {
                const divMapa = document.getElementById('mapa-gps-pwa');
                if (!divMapa || typeof L === 'undefined') return;
                mapaPWA = L.map('mapa-gps-pwa').setView([-28.298, -70.785], 14);
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(mapaPWA);
                setTimeout(() => { mapaPWA.invalidateSize(); window.centrarEnMiUbicacion(); }, 500);
            } catch(e) {}
        }

        window.centrarEnMiUbicacion = function() {
            if (!mapaPWA) return;
            mapaPWA.locate({setView: true, maxZoom: 17});
            mapaPWA.on('locationfound', function(e) {
                if (window.marcadorGPS_PWA) mapaPWA.removeLayer(window.marcadorGPS_PWA);
                const iconoGPS = L.divIcon({ className: 'gps-pin', html: `<div style="background-color: #3b82f6; width: 16px; height: 16px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 15px #3b82f6; animation: pulse 1s infinite;"></div>`, iconSize: [16, 16] });
                window.marcadorGPS_PWA = L.marker(e.latlng, {icon: iconoGPS}).addTo(mapaPWA);
            });
        }

        window.buscarEnMapaPWA = function(e) {
            if (e.key !== 'Enter' || !mapaPWA) return;
            const busqueda = e.target.value.toLowerCase().trim();
            if (!busqueda) return;

            const equipo = catalogoGlobal.find(eq => 
                (eq.tag && eq.tag.toLowerCase().includes(busqueda)) ||
                (eq.id && eq.id.toLowerCase().includes(busqueda))
            );

            if (!equipo) { alert(`⚠️ No se encontró ningún equipo que coincida con "${busqueda}".`); return; }
            if (!equipo.lat || !equipo.lng || isNaN(equipo.lat) || isNaN(equipo.lng)) {
                alert(`⚠️ El equipo "${equipo.tag}" está en el catastro, pero no tiene coordenadas GPS registradas.`); return;
            }

            mapaPWA.flyTo([equipo.lat, equipo.lng], 18, { animate: true, duration: 1.5 });
            
            let colorPin = equipo.sev === 'Rojo' ? '#ef4444' : equipo.sev === 'Naranja' ? '#f97316' : '#22c55e';
            const iconEquipo = L.divIcon({
                className: 'eq-pin',
                html: `<div style="background-color: ${colorPin}; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px ${colorPin};"></div>`,
                iconSize: [14, 14]
            });

            const htmlPopup = `
                <div style="font-family: sans-serif; padding: 2px;">
                    <strong style="color:#0f172a; font-size: 1rem;">${equipo.tag}</strong><br>
                    <span style="color:#64748b; font-size: 0.8rem;">${equipo.area}</span><br>
                    <button onclick="window.reportarDesdeMapa('${equipo.tag}', '${equipo.area}', '${equipo.siteId}')" 
                            style="margin-top:8px; background:#3b82f6; color:white; border:none; padding:8px 12px; border-radius:6px; width:100%; cursor:pointer; font-weight:bold;">
                        Reportar Aquí
                    </button>
                </div>`;
            
            L.marker([equipo.lat, equipo.lng], { icon: iconEquipo }).addTo(mapaPWA).bindPopup(htmlPopup).openPopup();
        };

        window.reportarDesdeMapa = function(tag, area, faena) {
            window.cambiarVistaPWA('reporte');
            window.avanzarPaso(1);
            
            const selectFaena = document.getElementById('fieldFaena');
            if (selectFaena) { selectFaena.value = faena; window.cargarAreasPorFaena(); }
            
            setTimeout(() => {
                const selectArea = document.getElementById('fieldArea');
                if (selectArea) { selectArea.value = area; window.cargarEquiposPorArea(); }
                setTimeout(() => {
                    const selectTag = document.getElementById('fieldTagSelect');
                    if (selectTag) {
                        selectTag.value = tag;
                        window.seleccionarEquipoTag(tag); // Gatilla la carga de Spots
                    }
                    window.mostrarNotificacion("📍 Equipo cargado desde el mapa.");
                }, 50);
            }, 50);
        };

        // SERVICE WORKER (PWA)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('✅ Service Worker activo:', reg.scope);
                }).catch(err => {
                    console.error('❌ Error SW:', err);
                });
            });
        }
    </script>
</body>
</html>
