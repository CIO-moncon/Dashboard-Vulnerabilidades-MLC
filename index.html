<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBd5MEZdMmgzBs1xCyeGYeKtQx5gJIeY3w",
    authDomain: "dashboard-vulnerabilidades-mlc.firebaseapp.com",
    databaseURL: "https://dashboard-vulnerabilidades-mlc-default-rtdb.firebaseio.com",
    projectId: "dashboard-vulnerabilidades-mlc"
  };
  try { firebase.initializeApp(firebaseConfig); } catch(e){}
  const db = firebase.database().ref('activos_criticos');
  const dbUsers = firebase.database().ref('usuarios_registrados');
  const dbAlertasTerreno = firebase.database().ref('alertas_terreno');

  let currentScreen = 1;
  let usuarioActivo = null;
  let faenaAsignadaOperador = null;
  let isSuperAdmin = false;
  let equiposDB = [];
  let alertasTerrenoDB = [];
  let faenaSeleccionadaScreen2 = null;
  let siteAreaSeleccionadaScreen2 = null;
  let equipoSeleccionado = null;
  let equipoIdActualModalDetalle = null;
  let mapaGlobalInstancia = null, capaGlobalMarkers = null;
  let mapaSiteInstancia = null, capaSiteMarkers = null;
  let siteMapVisible = false;
  let currentAuthMode = 'login';
  let currentUsdClp = 945.72; const currentHierroUsdFe62 = 98.02;

  const FAENAS_LIST = [
    'Planta, Mina los Colorados',
    'Mina, Mina los Colorados',
    'Planta de Pellets',
    'Planta, Mina el Romeral',
    'Mina, Mina el Romeral'
  ];

  const SEV_PESO = { 'Rojo': 5, 'Naranja': 4, 'Amarillo': 3, 'Verde': 2, 'Plomo': 1 };
  const SEV_COLOR_HEX = { 'Rojo': '#ef4444', 'Naranja': '#f97316', 'Amarillo': '#eab308', 'Verde': '#22c55e', 'Plomo': '#6b7280' };

  function normalizarSiteId(siteRaw) {
    if (FAENAS_LIST.includes(siteRaw)) return siteRaw;
    return 'Planta, Mina los Colorados';
  }

  function generarSeedMasivoColorados() {
    const list = [];
    const areasColorados = ['Chancado Primario', 'Molienda SAG', 'Correas Transporte', 'Despacho Fino', 'Stockpile', 'SSEE Principal'];
    for(let i=1; i<=207; i++) {
      const area = areasColorados[i % areasColorados.length];
      const sevRand = i % 18 === 0 ? 'Rojo' : (i % 7 === 0 ? 'Naranja' : 'Verde');
      list.push({
        id: `mlc_eq_${i}`,
        siteId: 'Planta, Mina los Colorados',
        domain: i % 2 === 0 ? 'planta' : 'mina',
        area: area,
        tag: `MLC-TAG-${1000 + i}`,
        tipo: i % 3 === 0 ? 'Reductor' : 'Motor/Correa',
        fecha: '2026-09-20',
        lat: (-28.2876 + (Math.random()*0.018 - 0.009)).toFixed(5),
        lng: (-70.8130 + (Math.random()*0.018 - 0.009)).toFixed(5),
        componentes: [{ nombre: 'Spot Principal', severidad: sevRand, rms: (2.0 + Math.random()*3).toFixed(1), om: i%12===0?`OM-${4000+i}`:'' }]
      });
    }
    list.push({ id: 'rom_1', siteId: 'Mina, Mina el Romeral', domain: 'mina', area: 'Pit Principal', tag: 'ROM-PALA-01', tipo: 'Hidráulica', lat: '-29.7340', lng: '-71.2510', componentes: [{severidad:'Verde', rms:'1.5'}] });
    list.push({ id: 'pel_1', siteId: 'Planta de Pellets', domain: 'planta', area: 'Induración', tag: 'PEL-HORNO-01', tipo: 'Horno', lat: '-27.3670', lng: '-70.3335', componentes: [{severidad:'Naranja', rms:'3.9'}] });
    return list;
  }

  equiposDB = generarSeedMasivoColorados();

  db.on('value', snap => {
    const raw = snap.val();
    if (raw) {
      equiposDB = Object.keys(raw).map(k => {
        const item = raw[k];
        return {
          id: k,
          siteId: normalizarSiteId(item.siteId),
          domain: item.domain || 'planta',
          area: item.area || 'Área General',
          tag: item.tag || k,
          tipo: item.tipo || 'Activo',
          fecha: item.fecha || '',
          lat: item.lat || '',
          lng: item.lng || '',
          componentes: item.componentes || []
        };
      });
    }
    refreshCurrentScreen();
  }, () => {
    equiposDB = generarSeedMasivoColorados();
    refreshCurrentScreen();
  });

  dbAlertasTerreno.on('value', snap => {
    const raw = snap.val();
    alertasTerrenoDB = raw ? Object.keys(raw).map(k => ({ id: k, ...raw[k] })) : [];
    refreshCurrentScreen();
  });

  dbAlertasTerreno.limitToLast(1).on('child_added', snap => {
    const data = snap.val();
    if (!data) return;
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed; bottom:25px; right:25px; background:#18181b; border:2px solid #ef4444; color:white; padding:18px; border-radius:10px; z-index:9999; box-shadow:0 12px 35px rgba(0,0,0,0.9); max-width:340px; animation: pulseGlowRed 1.5s infinite;';
    toast.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <b style="color:#ef4444; font-size:0.85rem;">💬 REPORTE DE TERRENO</b>
        <button onclick="this.parentElement.parentElement.remove()" style="background:transparent; border:none; color:white; font-size:1.1rem; cursor:pointer;">&times;</button>
      </div>
      <div style="font-size:0.75rem; line-height:1.4;">
        <b>Faena:</b> ${data.faena} (${data.area})<br>
        <b>Tag:</b> <span class="code-font" style="color:#3b82f6;">${data.tag}</span> | <b>Sev:</b> <span style="color:#ef4444;font-weight:bold;">${data.severidad}</span><br>
        <b>Nota:</b> ${data.detalle}
      </div>
    `;
    document.body.appendChild(toast);
  });

  function goScreen(num) {
    currentScreen = num;
    document.querySelectorAll('.screen-view').forEach(el => el.classList.remove('active'));
    document.getElementById(`screen-${num}`).classList.add('active');
    const titles = { 1: 'VISTA PÚBLICA (GLOBAL)', 2: `FAENA: ${faenaSeleccionadaScreen2 || 'ASIGNADA'}`, 3: 'CONSOLA GLOBAL SUPERADMIN' };
    document.getElementById('headerScreenTitle').innerText = titles[num] || 'CIO';
    if (num !== 2) { siteMapVisible = false; const md = document.getElementById('view-site-map'); if (md) md.style.display = 'none'; }
    refreshCurrentScreen();
    if (num === 3) initMapaGlobal();
  }

  function stepBackScreen2() {
    if (siteMapVisible) {
      toggleSiteMapTab();
      return;
    }
    if (siteAreaSeleccionadaScreen2) {
      siteAreaSeleccionadaScreen2 = null;
      renderScreen2Site();
      return;
    }
    goScreen(1);
  }

  function updateScreen2NavigationUI() {
    const btnBack = document.querySelector('#screen-2 .btn-back-nav span');
    const breadcrumb = document.getElementById('subBreadcrumbSite');
    const targetSite = faenaSeleccionadaScreen2 || faenaAsignadaOperador || FAENAS_LIST[0];

    if (siteMapVisible) {
      if(btnBack) btnBack.innerText = 'Volver a Tarjetas';
      if(breadcrumb) breadcrumb.innerText = `Faena / ${targetSite} [Modo GIS Full-Width]`;
    } else if (siteAreaSeleccionadaScreen2) {
      if(btnBack) btnBack.innerText = 'Volver a Áreas';
      if(breadcrumb) breadcrumb.innerText = `Faena / ${targetSite} / ${siteAreaSeleccionadaScreen2}`;
    } else {
      if(btnBack) btnBack.innerText = 'Volver a Global';
      if(breadcrumb) breadcrumb.innerText = `Faena / ${targetSite}`;
    }
  }

  function refreshCurrentScreen() {
    if (currentScreen === 1) renderScreen1Public();
    else if (currentScreen === 2) renderScreen2Site();
    else if (currentScreen === 3) renderScreen3Global();
  }

  function renderScreen1Public() {
    const container = document.getElementById('viewScreen1Content');
    if (!container) return;
    const faenasGroup = {};
    FAENAS_LIST.forEach(f => faenasGroup[f] = { count: 0, critical: 0, maxSevPeso: 1, maxSev: 'Plomo' });
    
    equiposDB.forEach(eq => {
      const f = normalizarSiteId(eq.siteId);
      if (!faenasGroup[f]) faenasGroup[f] = { count: 0, critical: 0, maxSevPeso: 1, maxSev: 'Plomo' };
      faenasGroup[f].count++;
      const sev = calcMaxSev(eq.componentes);
      if (sev === 'Rojo' || sev === 'Naranja') faenasGroup[f].critical++;
      if (SEV_PESO[sev] > faenasGroup[f].maxSevPeso) {
        faenasGroup[f].maxSevPeso = SEV_PESO[sev];
        faenasGroup[f].maxSev = sev;
      }
    });

    const faenasArr = FAENAS_LIST.map(f => ({ name: f, ...faenasGroup[f] }));
    faenasArr.sort((a, b) => b.maxSevPeso - a.maxSevPeso || b.critical - a.critical);

    container.innerHTML = faenasArr.map(d => {
      const animClass = (d.maxSev === 'Rojo' || d.maxSev === 'Naranja') ? `anim-${d.maxSev.toLowerCase()}` : '';
      return `<div class="card-area ${animClass}" onclick="seleccionarFaenaScreen2('${d.name.replace(/'/g, "\\'")}')">
        <div class="label-muted">Faena Operativa CMP</div>
        <div class="value-strong" style="font-size:0.95rem; margin:4px 0;">${d.name}</div>
        <div style="display:flex; justify-content:space-between; margin-top:10px; padding-top:6px; border-top:1px solid var(--border-card);">
          <div><div class="label-muted">Activos</div><div class="value-strong">${d.count}</div></div>
          <div><div class="label-muted">Condición</div><div class="value-strong" style="color:${SEV_COLOR_HEX[d.maxSev]}">${d.critical > 0 ? d.critical + ' Alerta' : 'Normal'}</div></div>
        </div>
      </div>`;
    }).join('');
  }

  function seleccionarFaenaScreen2(faenaName) {
    faenaSeleccionadaScreen2 = faenaName;
    siteAreaSeleccionadaScreen2 = null;
    if (!usuarioActivo) faenaAsignadaOperador = faenaName;
    document.getElementById('badgeFaenaAsignada').innerText = faenaName;
    siteMapVisible = false;
    const md = document.getElementById('view-site-map'); if(md) md.style.display = 'none';
    document.getElementById('labelToggleSiteMap').innerText = 'Ver Mapa de Faena';
    goScreen(2);
  }

  function toggleSiteMapTab() {
    siteMapVisible = !siteMapVisible;
    const md = document.getElementById('view-site-map');
    const container = document.getElementById('viewScreen2Container');
    const lbl = document.getElementById('labelToggleSiteMap');
    const targetSite = faenaSeleccionadaScreen2 || faenaAsignadaOperador || FAENAS_LIST[0];
    const eqs = equiposDB.filter(e => normalizarSiteId(e.siteId) === targetSite);

    if (siteMapVisible) {
      if(md) md.style.display = 'block';
      if(container) container.style.display = 'none';
      lbl.innerText = 'Ocultar Mapa';
      actualizarMapaSiteAutomatico(eqs, targetSite);
    } else {
      if(md) md.style.display = 'none';
      if(container) container.style.display = '';
      lbl.innerText = 'Ver Mapa de Faena';
    }
    updateScreen2NavigationUI();
  }

  function renderScreen2Site() {
    const targetSite = faenaSeleccionadaScreen2 || faenaAsignadaOperador || FAENAS_LIST[0];
    document.getElementById('screen2SiteTitle').innerText = targetSite;
    const eqs = equiposDB.filter(e => normalizarSiteId(e.siteId) === targetSite);
    const container = document.getElementById('viewScreen2Container');
    if (!container) return;
    container.style.display = siteMapVisible ? 'none' : '';

    if (!siteAreaSeleccionadaScreen2) {
      const areasMap = {};
      eqs.forEach(eq => {
        const ar = eq.area || 'Sin Área';
        if (!areasMap[ar]) areasMap[ar] = { count: 0, criticalRojo: 0, criticalNaranja: 0, maxSevPeso: 1, maxSev: 'Plomo' };
        areasMap[ar].count++;
        const sev = calcMaxSev(eq.componentes);
        if (sev === 'Rojo') areasMap[ar].criticalRojo++;
        if (sev === 'Naranja') areasMap[ar].criticalNaranja++;
        if (SEV_PESO[sev] > areasMap[ar].maxSevPeso) {
          areasMap[ar].maxSevPeso = SEV_PESO[sev];
          areasMap[ar].maxSev = sev;
        }
      });

      const areasArr = Object.keys(areasMap).map(ar => ({ name: ar, ...areasMap[ar] }));
      areasArr.sort((a, b) => b.maxSevPeso - a.maxSevPeso || b.criticalRojo - a.criticalRojo || b.criticalNaranja - a.criticalNaranja);

      container.className = 'grid-container';
      container.innerHTML = areasArr.map(d => {
        const animClass = (d.maxSev === 'Rojo' || d.maxSev === 'Naranja') ? `anim-${d.maxSev.toLowerCase()}` : '';
        const critTotal = d.criticalRojo + d.criticalNaranja;
        return `<div class="card-area ${animClass}" onclick="seleccionarAreaScreen2('${d.name.replace(/'/g, "\\'")}')">
          <div class="label-muted">Área Operacional</div>
          <div class="value-strong" style="font-size:0.95rem; margin:4px 0;">${d.name}</div>
          <div style="display:flex; justify-content:space-between; margin-top:10px; padding-top:6px; border-top:1px solid var(--border-card);">
            <div><div class="label-muted">Activos</div><div class="value-strong">${d.count}</div></div>
            <div><div class="label-muted">Condición</div><div class="value-strong" style="color:${SEV_COLOR_HEX[d.maxSev]}">${critTotal > 0 ? critTotal + ' Alerta' : 'Normal'}</div></div>
          </div>
        </div>`;
      }).join('') || '<div style="color:var(--text-muted); grid-column:1/-1;">Sin áreas registradas en esta faena.</div>';
    } else {
      container.className = 'grid-equipos';
      const eqsArea = eqs.filter(e => (e.area || 'Sin Área') === siteAreaSeleccionadaScreen2);
      eqsArea.sort((a, b) => SEV_PESO[calcMaxSev(b.componentes)] - SEV_PESO[calcMaxSev(a.componentes)]);

      container.innerHTML = eqsArea.map(eq => {
        const sev = calcMaxSev(eq.componentes);
        const anim = (sev === 'Rojo' || sev === 'Naranja') ? `anim-${sev.toLowerCase()}` : '';
        const fieldCount = alertasTerrenoDB.filter(a => (a.tag || '').trim().toUpperCase() === (eq.tag || '').trim().toUpperCase()).length;
        const fieldBadge = fieldCount > 0 
          ? `<div style="position:absolute; top:4px; right:4px; background:rgba(59,130,246,0.3); color:#60a5fa; border:1px solid #3b82f6; font-size:0.55rem; padding:2px 5px; border-radius:4px; font-weight:700; z-index:2;">💬 Terreno (${fieldCount})</div>` 
          : '';

        return `<div class="card-equipo sev-${sev.toLowerCase()} ${anim}" onclick="abrirDetalleActivoModal('${eq.id}')">
          ${fieldBadge}
          <div class="eq-type">${eq.area || 'Planta'}</div>
          <div class="eq-tag code-font">${eq.tag}</div>
          <div class="eq-type" style="color:${SEV_COLOR_HEX[sev]}">${sev.toUpperCase()}</div>
        </div>`;
      }).join('') || '<div style="color:var(--text-muted); grid-column:1/-1;">Sin equipos en esta área.</div>';
    }
    
    updateScreen2NavigationUI();
    if (siteMapVisible) actualizarMapaSiteAutomatico(eqs, targetSite);
  }

  function seleccionarAreaScreen2(areaName) {
    siteAreaSeleccionadaScreen2 = areaName;
    renderScreen2Site();
  }

  function abrirDetalleActivoModal(eqId) {
    equipoIdActualModalDetalle = eqId;
    const eq = equiposDB.find(e => e.id === eqId);
    if (!eq) return;
    document.getElementById('detSiteTag').innerText = `${eq.siteId} | TAG: ${eq.tag}`;
    document.getElementById('detTitle').innerText = `${eq.tipo} - ${eq.area}`;
    const list = document.getElementById('detComponentesList');
    
    const sortedComps = [...(eq.componentes || [])].sort((a,b) => SEV_PESO[b.severidad||'Plomo'] - SEV_PESO[a.severidad||'Plomo']);

    list.innerHTML = sortedComps.map(c => `
      <div style="background:var(--input-bg); padding:10px; border-radius:6px; border:1px solid var(--border-card); ${c.severidad==='Rojo'?'border-left:4px solid #ef4444;':''}">
        <div style="display:flex; justify-content:space-between;">
          <b>${c.nombre || 'Spot Principal'}</b>
          <span style="color:${SEV_COLOR_HEX[c.severidad]||'#fff'}; font-weight:bold;">${c.severidad}</span>
        </div>
        <div style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">RMS: ${c.rms || 'N/D'} | OM: ${c.om || 'S/N'}</div>
      </div>
    `).join('') || '<div style="color:var(--text-muted);">Sin spots oficiales detallados.</div>';

    const terList = document.getElementById('detTerrenoList');
    const targetTag = (eq.tag || '').trim().toUpperCase();
    const myReports = alertasTerrenoDB.filter(a => (a.tag || '').trim().toUpperCase() === targetTag)
                                     .sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));

    terList.innerHTML = myReports.length > 0 ? myReports.map(r => `
      <div style="background:var(--input-bg); padding:10px; border-radius:6px; border:1px solid var(--border-card); border-left:3px solid #3b82f6; font-size:0.78rem;">
        <div style="display:flex; justify-content:space-between; color:var(--text-muted); font-size:0.68rem; margin-bottom:4px;">
          <span>🕒 ${new Date(r.timestamp).toLocaleString()}</span>
          <span style="color:${SEV_COLOR_HEX[r.severidad]||'#fff'}; font-weight:bold;">${r.severidad}</span>
        </div>
        <div><b>Hallazgo:</b> ${r.detalle}</div>
        ${r.fotoBase64 ? `<div style="margin-top:6px;"><img src="${r.fotoBase64}" style="height:60px; border-radius:4px; cursor:pointer; border:1px solid var(--border-card);" onclick="verFotoFull('${r.fotoBase64}')"></div>` : ''}
      </div>
    `).join('') : '<div style="color:var(--text-muted); font-size:0.78rem; font-style:italic;">Sin reportes tácticos de terreno registrados para este tag.</div>';

    document.getElementById('modalDetalleActivo').style.display = 'flex';
  }

  function verFotoFull(b64) {
    document.getElementById('imgVisorFull').src = b64;
    document.getElementById('modalVisorFoto').style.display = 'flex';
  }

  function editarActivoActualDesdeDetalle() {
    if (!equipoIdActualModalDetalle) return;
    document.getElementById('modalDetalleActivo').style.display = 'none';
    abrirEdicionEquipoGlobal(equipoIdActualModalDetalle);
  }

  function actualizarMapaSiteAutomatico(eqs, targetSite) {
    const valid = eqs.filter(eq => {
      const lat = parseFloat(eq.lat), lng = parseFloat(eq.lng);
      return !isNaN(lat) && !isNaN(lng) && lat !== 0;
    });

    if (valid.length === 0) return;

    setTimeout(() => {
      if (!mapaSiteInstancia) {
        mapaSiteInstancia = L.map('view-site-map').setView([-28.2876, -70.8130], 13);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:20}).addTo(mapaSiteInstancia);
        capaSiteMarkers = L.layerGroup().addTo(mapaSiteInstancia);
      } else {
        mapaSiteInstancia.invalidateSize();
      }
      if (capaSiteMarkers) {
        capaSiteMarkers.clearLayers();
        let validLatLngs = [];
        valid.forEach(eq => {
          const lat = parseFloat(eq.lat), lng = parseFloat(eq.lng);
          const sev = calcMaxSev(eq.componentes);
          const col = SEV_COLOR_HEX[sev] || '#6b7280';
          const pulseClass = sev === 'Rojo' ? 'map-pin-pulse' : '';
          const icono = L.divIcon({
            className: 'custom-map-marker',
            html: `<div class="${pulseClass}" style="background-color: ${col}; width: 22px; height: 22px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 12px ${col};"></div>`,
            iconSize: [22, 22], iconAnchor:
          });
          L.marker([lat, lng], {icon: icono}).bindPopup(`<b>${eq.tag}</b><br>Área: ${eq.area}<br><b style="color:${col};">${sev.toUpperCase()}</b>`).addTo(capaSiteMarkers);
          validLatLngs.push([lat, lng]);
        });
        if (validLatLngs.length) mapaSiteInstancia.fitBounds(L.latLngBounds(validLatLngs), {padding:[40,40], maxZoom:17});
      }
    }, 150);
  }

  function renderScreen3Global() {
    const filter = document.getElementById('superAdminFilterSite')?.value || 'TODAS';
    const eqs = filter === 'TODAS' ? equiposDB : equiposDB.filter(e => normalizarSiteId(e.siteId) === filter);
    eqs.sort((a, b) => SEV_PESO[calcMaxSev(b.componentes)] - SEV_PESO[calcMaxSev(a.componentes)]);
    const container = document.getElementById('viewScreen3Global');
    if (!container) return;

    container.innerHTML = eqs.map(eq => {
      const sev = calcMaxSev(eq.componentes);
      const anim = (sev === 'Rojo' || sev === 'Naranja') ? `anim-${sev.toLowerCase()}` : '';
      return `<div class="card-equipo sev-${sev.toLowerCase()} ${anim}" style="cursor:default;">
        <div class="label-muted">${eq.siteId}</div>
        <div class="eq-tag code-font">${eq.tag}</div>
        <div style="margin-top:6px; display:flex; gap:4px; justify-content:center;">
          <button class="btn-base btn-primary" style="padding:3px 6px; font-size:0.65rem;" onclick="abrirEdicionEquipoGlobal('${eq.id}')">✏️ Editar</button>
        </div>
      </div>`;
    }).join('') || '<div style="color:var(--text-muted); grid-column:1/-1;">Sin activos en filtro global.</div>';
    actualizarMapaGlobalSiActivo();
  }

  function initMapaGlobal() {
    setTimeout(() => {
      if (!mapaGlobalInstancia) {
        mapaGlobalInstancia = L.map('view-map').setView([-28.2876, -70.8130], 10);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:20}).addTo(mapaGlobalInstancia);
        capaGlobalMarkers = L.layerGroup().addTo(mapaGlobalInstancia);
      } else {
        mapaGlobalInstancia.invalidateSize();
      }
      actualizarMapaGlobalSiActivo();
    }, 250);
  }

  function actualizarMapaGlobalSiActivo() {
    if (!mapaGlobalInstancia || !capaGlobalMarkers) return;
    capaGlobalMarkers.clearLayers();
    const filter = document.getElementById('superAdminFilterSite')?.value || 'TODAS';
    const eqs = filter === 'TODAS' ? equiposDB : equiposDB.filter(e => normalizarSiteId(e.siteId) === filter);
    let valid = [];
    eqs.forEach(eq => {
      const lat = parseFloat(eq.lat), lng = parseFloat(eq.lng);
      if (!isNaN(lat) && !isNaN(lng) && lat !== 0) {
        const sev = calcMaxSev(eq.componentes);
        const col = SEV_COLOR_HEX[sev] || '#6b7280';
        const pulseClass = sev === 'Rojo' ? 'map-pin-pulse' : '';
        const icono = L.divIcon({
          className: 'custom-map-marker',
          html: `<div class="${pulseClass}" style="background-color: ${col}; width: 22px; height: 22px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 12px ${col};"></div>`,
          iconSize: [22, 22], iconAnchor:
        });
        L.marker([lat, lng], {icon: icono}).bindPopup(`<b>${eq.tag}</b><br>${eq.siteId}<br><b style="color:${col};">${sev.toUpperCase()}</b>`).addTo(capaGlobalMarkers);
        valid.push([lat, lng]);
      }
    });
    if (valid.length) mapaGlobalInstancia.fitBounds(L.latLngBounds(valid), {padding:[40,40], maxZoom:16});
  }

  function toggleMapModal() {
    const box = document.getElementById('viewMapGlobalContainer');
    const isHidden = box.style.display === 'none';
    box.style.display = isHidden ? 'block' : 'none';
    if (isHidden) initMapaGlobal();
  }

  function calcMaxSev(comps) {
    if (!comps || !comps.length) return 'Plomo';
    let maxP = 1, sev = 'Plomo';
    comps.forEach(c => { if (SEV_PESO[c.severidad] > maxP) { maxP = SEV_PESO[c.severidad]; sev = c.severidad; } });
    return sev;
  }

  function toggleUserDropdown() {
    const m = document.getElementById('userDropdownMenu');
    m.style.display = m.style.display === 'block' ? 'none' : 'block';
  }

  function handleUserBtnClick() {
    if (!usuarioActivo) {
      abrirModalAuth('login');
    } else {
      toggleUserDropdown();
    }
  }

  function setAuthMode(mode) {
    currentAuthMode = mode;
    const btnLogin = document.getElementById('tabBtnLogin');
    const btnRegister = document.getElementById('tabBtnRegister');
    const boxName = document.getElementById('boxFullName');
    const boxSite = document.getElementById('boxFaenaSite');
    const title = document.getElementById('authModalHeaderTitle');
    const desc = document.getElementById('authModalHeaderDesc');
    const submitBtn = document.getElementById('authSubmitActionBtn');

    if (mode === 'login') {
      btnLogin.style.background = 'var(--accent-color)'; btnLogin.style.color = 'white'; btnLogin.style.fontWeight = '700';
      btnRegister.style.background = 'transparent'; btnRegister.style.color = 'var(--text-muted)'; btnRegister.style.fontWeight = '600';
      boxName.style.display = 'none';
      boxSite.style.display = 'none';
      title.innerText = 'Acceso Operador CIO';
      desc.innerText = 'Ingresa tus credenciales autorizadas por CMP.';
      submitBtn.innerText = 'Ingresar al Sistema';
    } else {
      btnRegister.style.background = 'var(--accent-color)'; btnRegister.style.color = 'white'; btnRegister.style.fontWeight = '700';
      btnLogin.style.background = 'transparent'; btnLogin.style.color = 'var(--text-muted)'; btnLogin.style.fontWeight = '600';
      boxName.style.display = 'block';
      boxSite.style.display = 'block';
      title.innerText = 'Crear Cuenta de Operador';
      desc.innerText = 'Regístrate y define tu faena de escritura.';
      submitBtn.innerText = 'Registrarse y Entrar';
    }
  }

  function abrirModalAuth(mode = 'login') {
    document.getElementById('userDropdownMenu').style.display = 'none';
    setAuthMode(mode);
    document.getElementById('modalAuth').style.display = 'flex';
  }

  function handleAuthSubmission() {
    const userVal = (document.getElementById('authUsername').value || '').trim();
    const passVal = (document.getElementById('authPassword').value || '').trim();
    const selectedSite = document.getElementById('authSelectedSite').value;
    const fullnameVal = (document.getElementById('authFullname').value || '').trim();

    if (!userVal || !passVal) { alert("⚠️ Completa usuario y contraseña."); return; }
    const lookupId = userVal.replace(/[^a-zA-Z0-9]/g, '_');

    if (currentAuthMode === 'register') {
      if (!fullnameVal) { alert("⚠️ Ingresa tu nombre completo."); return; }
      dbUsers.child(lookupId).set({
        nombreCompleto: fullnameVal, usuario: userVal, password: passVal, faenaAsignada: selectedSite, creadoEn: new Date().toISOString()
      }).then(() => {
        alert("✅ Usuario registrado exitosamente.");
        document.getElementById('modalAuth').style.display = 'none';
        loguearUsuarioDirecto(fullnameVal, selectedSite);
      }).catch(err => alert("❌ Error: " + err.message));
    } else {
      dbUsers.child(lookupId).once('value', snap => {
        const uData = snap.val();
        loguearUsuarioDirecto((uData && uData.password === passVal) ? (uData.nombreCompleto || uData.usuario) : userVal, uData?.faenaAsignada || 'Planta, Mina los Colorados');
        document.getElementById('modalAuth').style.display = 'none';
      });
    }
  }

  function loguearUsuarioDirecto(u, site) {
    usuarioActivo = u; faenaAsignadaOperador = site;
    document.body.classList.add('user-authenticated');
    document.getElementById('labelUsuarioBtn').innerText = u.split('@')[0];
    document.getElementById('dropUserInfo').innerText = `Activo: ${u} | Faena: ${site}`;
    document.getElementById('dropLogoutBtn').style.display = 'block';
    alert(`✅ Bienvenido ${u}. Edición habilitada en faena: ${site}.`);
  }

  function cerrarSesionUsuario() {
    usuarioActivo = null; faenaAsignadaOperador = null; isSuperAdmin = false;
    document.body.classList.remove('user-authenticated');
    document.body.classList.remove('superadmin-active');
    document.getElementById('labelUsuarioBtn').innerText = 'Entrar';
    document.getElementById('dropUserInfo').innerText = 'Invitado (Solo Lectura)';
    document.getElementById('dropLogoutBtn').style.display = 'none';
    goScreen(1);
    alert("🚪 Sesión cerrada.");
  }

  function solicitarPermisoSuperAdmin() {
    const pass = prompt("🔑 Ingrese clave SuperAdmin:");
    if (pass === "Moncon2026") {
      isSuperAdmin = true;
      document.body.classList.add('superadmin-active');
      goScreen(3);
      alert("⚡ SuperAdmin activado: Acceso global multifaena y reportes.");
    } else if (pass !== null) {
      alert("❌ Clave SuperAdmin incorrecta.");
    }
  }

  function toggleTheme() { document.body.classList.toggle('light-mode'); }
  
  function abrirEdicionEquipoNuevoAuth() {
    const targetSite = faenaSeleccionadaScreen2 || faenaAsignadaOperador || 'Planta, Mina los Colorados';
    equipoSeleccionado = { id: 'EQ_' + Date.now(), siteId: targetSite, domain: 'planta', area: siteAreaSeleccionadaScreen2 || 'Área General', componentes: [] };
    abrirEdicionEquipoGlobalObj();
  }

  function abrirEdicionGlobalNuevo() {
    const targetSite = faenaSeleccionadaScreen2 || 'Planta, Mina los Colorados';
    equipoSeleccionado = { id: 'EQ_' + Date.now(), siteId: targetSite, domain: 'planta', componentes: [] };
    abrirEdicionEquipoGlobalObj();
  }
  function abrirEdicionEquipoGlobal(eqId) {
    equipoSeleccionado = equiposDB.find(e => e.id === eqId);
    if (equipoSeleccionado) abrirEdicionEquipoGlobalObj();
  }
  function abrirEdicionEquipoGlobalObj() {
    document.getElementById('edSiteId').value = equipoSeleccionado.siteId;
    document.getElementById('edDomain').value = equipoSeleccionado.domain || 'planta';
    document.getElementById('edArea').value = equipoSeleccionado.area || '';
    document.getElementById('edTag').value = equipoSeleccionado.tag || '';
    document.getElementById('edTipo').value = equipoSeleccionado.tipo || '';
    document.getElementById('edFecha').value = equipoSeleccionado.fecha || '';
    document.getElementById('edLat').value = equipoSeleccionado.lat || '';
    document.getElementById('edLng').value = equipoSeleccionado.lng || '';
    const cont = document.getElementById('edComponentesContainer'); cont.innerHTML = '';
    (equipoSeleccionado.componentes || []).forEach(c => agregarFormComponente(c));
    document.getElementById('modalEdicion').style.display = 'block';
  }
  function agregarFormComponente(data = {}) {
    const cont = document.getElementById('edComponentesContainer'), div = document.createElement('div');
    div.style.cssText = "background:var(--bg-main); padding:14px; border:1px solid var(--border-card); border-radius:8px; position:relative;";
    div.className = 'comp-item';
    div.innerHTML = `<button class="btn-danger" style="position:absolute; top:10px; right:10px; padding:3px 6px; font-size:0.65rem;" onclick="this.parentElement.remove()">Eliminar</button>
    <div class="form-grid"><div><label>Spot / Falla</label><input type="text" class="c-nom" value="${data.nombre||''}"></div><div><label>RMS</label><input type="text" class="c-rms" value="${data.rms||''}"></div><div><label>Sev</label><select class="c-sev"><option value="Rojo" ${data.severidad==='Rojo'?'selected':''}>Rojo</option><option value="Naranja" ${data.severidad==='Naranja'?'selected':''}>Naranja</option><option value="Verde" ${data.severidad==='Verde'?'selected':''}>Verde</option></select></div></div>`;
    cont.appendChild(div);
  }
  function cerrarEdicion() { document.getElementById('modalEdicion').style.display = 'none'; }
  function guardarEquipo() {
    if (!equipoSeleccionado) return;
    const comps = [];
    document.querySelectorAll('.comp-item').forEach(el => comps.push({ nombre: el.querySelector('.c-nom').value, rms: el.querySelector('.c-rms').value, severidad: el.querySelector('.c-sev').value }));
    db.child(equipoSeleccionado.id).update({
      siteId: document.getElementById('edSiteId').value, domain: document.getElementById('edDomain').value,
      area: document.getElementById('edArea').value, tag: document.getElementById('edTag').value, tipo: document.getElementById('edTipo').value,
      lat: document.getElementById('edLat').value, lng: document.getElementById('edLng').value, componentes: comps
    }).then(() => cerrarEdicion());
  }
  function eliminarEquipo() {
    if (confirm('¿Eliminar activo?')) db.child(equipoSeleccionado.id).remove().then(() => cerrarEdicion());
  }

  function procesarCargaExcelFaena(e) {
    const file = e.target.files[0]; if (!file) return;
    const targetSite = faenaSeleccionadaScreen2 || faenaAsignadaOperador || 'Planta, Mina los Colorados';
    const reader = new FileReader();
    reader.onload = function(evt) {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, {type: 'array'});
      const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
      let count = 0;
      json.forEach(row => {
        if(row.Tag) {
          const id = 'EQ_EXCEL_' + Date.now() + '_' + count;
          db.child(id).set({
            siteId: targetSite, domain: 'planta', area: row.Area || 'General', tag: row.Tag, tipo: row.Tipo || 'Activo',
            lat: row.Lat || '', lng: row.Lng || '', componentes: [{nombre:'Spot Masivo', severidad:'Verde'}]
          });
          count++;
        }
      });
      alert(`✅ Carga masiva exitosa: ${count} activos en ${targetSite}.`);
    };
    reader.readAsArrayBuffer(file);
    e.target.value = '';
  }

  function exportarReporteGerenciaAlta() {
    const ts = new Date().toISOString();
    let r=0, n=0, total=equiposDB.length;
    equiposDB.forEach(eq => { const s = calcMaxSev(eq.componentes); if(s==='Rojo')r++; if(s==='Naranja')n++; });
    const txt = `REPORTE EJECUTIVO GLOBAL SUPERADMIN - CIO CMP\nFecha: ${ts}\nTotal Activos: ${total} | Rojos: ${r} | Naranjos: ${n}\nUSD/CLP: ${currentUsdClp} | Fe62: ${currentHierroUsdFe62}`;
    const blob = new Blob([txt], {type:'text/plain'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Reporte_Global_${ts.split('T')[0]}.txt`; a.click();
  }

  function exportarReporteGerenciaPorFaena() {
    const targetSite = document.getElementById('superAdminFilterSite')?.value || 'Planta, Mina los Colorados';
    const eqs = targetSite === 'TODAS' ? equiposDB : equiposDB.filter(e => normalizarSiteId(e.siteId) === targetSite);
    const ts = new Date().toISOString();
    let r=0, n=0;
    eqs.forEach(eq => { const s = calcMaxSev(eq.componentes); if(s==='Rojo')r++; if(s==='Naranja')n++; });
    const txt = `REPORTE POR FAENA [${targetSite}]\nFecha: ${ts}\nActivos Faena: ${eqs.length} | Rojos: ${r} | Naranjos: ${n}`;
    const blob = new Blob([txt], {type:'text/plain'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Reporte_${targetSite.replace(/[^a-zA-Z0-9]/g,'_')}.txt`; a.click();
  }

  window.addEventListener('click', e => { if (!document.getElementById('userMenuWrapper')?.contains(e.target)) document.getElementById('userDropdownMenu').style.display = 'none'; });
  
  setTimeout(() => { refreshCurrentScreen(); }, 200);
</script>
