# ============================================================================
# CIO Predictivo 2.0 — Integración Continua (CI)
# ============================================================================
# Se ejecuta en cada push/PR a las ramas principales. Valida frontend, backend
# y construye las imágenes Docker (sin publicarlas).
# ============================================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Frontend: typecheck, tests y build de producción.
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend (Vite + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cio-predictivo 2.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cio-predictivo 2.0/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      - name: Build de producción
        run: npm run build

      - name: Subir artefacto dist/
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: cio-predictivo 2.0/dist/
          retention-days: 7

  # -------------------------------------------------------------------------
  # Backend: compilación de sintaxis y tests (pytest).
  # -------------------------------------------------------------------------
  backend:
    name: Backend (FastAPI + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cio-predictivo 2.0/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check . && ruff format --check .

      - name: Compilación de sintaxis
        run: python -m py_compile main.py database.py security.py analizador_fft.py migrar_datos.py cambiar_clave.py backup_db.py conftest.py persistencia/*.py alembic/*.py alembic/versions/*.py

      - name: Tests (pytest)
        env:
          CIO_IMPORTAR_FIREBASE: '0'
        run: python -m pytest -q

  # -------------------------------------------------------------------------
  # Docker: construye las imágenes (sin publicarlas) para validar el build.
  # -------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen backend
        uses: docker/build-push-action@v6
        with:
          context: cio-predictivo 2.0/backend
          push: false
          tags: cio-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build imagen frontend
        uses: docker/build-push-action@v6
        with:
          context: cio-predictivo 2.0
          file: Dockerfile
          push: false
          tags: cio-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max