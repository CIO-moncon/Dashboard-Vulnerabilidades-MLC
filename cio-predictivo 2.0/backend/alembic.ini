[alembic]
# Ubicación de los scripts de migración (env.py, script.py.mako, versions/).
script_location = alembic
prepend_sys_path = .

# La URL real se calcula en env.py desde CIO_DB_PATH (o se inyecta por código).
# Dejarla vacía fuerza a env.py a resolverla; no poner credenciales aquí.
sqlalchemy.url =

# Nivel de ruido bajo: las migraciones en arranque no ensucian los logs/tests.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARN
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
