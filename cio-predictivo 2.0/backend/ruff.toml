# Ruff — linter y formatter para el backend Python.
# Ejecutar: ruff check . && ruff format --check .

target-version = "py311"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (manejado por formatter)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[lint.per-file-ignores]
"tests/*" = ["S101"]  # assert en tests
"conftest.py" = ["E402"]  # imports diferidos por variables de entorno

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true