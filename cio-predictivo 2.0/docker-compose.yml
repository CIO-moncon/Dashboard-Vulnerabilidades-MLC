# ============================================================================
# CIO Predictivo 2.0 — Orquestación Docker
# ============================================================================
# Uso:
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
#
# Antes de levantar, copie backend/.env.example a backend/.env y ajuste los
# secretos (CIO_SECRET_KEY, CIO_ADMIN_PASSWORD, etc.).
# ============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cio-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Sobrescribe la ruta de la BD para usar el volumen persistente.
      CIO_DB_PATH: /data/cio_predictivo.db
      CIO_IMPORTAR_FIREBASE: "0"
    volumes:
      - cio-data:/data
      # Opcional: montar firebase_data.json para migración inicial.
      # - ./backend/firebase_data.json:/app/firebase_data.json:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cio-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  cio-data:
    name: cio-predictivo-data

networks:
  default:
    name: cio-predictivo-net